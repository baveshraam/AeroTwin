<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroTwin · Model Preview</title>
<style>
  :root{
    --bg:#eef1f5; --ink:#14181f; --accent:#e07d17;
    --ink-2:rgba(20,24,31,.62); --line:rgba(20,24,31,.10);
    --sans:'Inter','Segoe UI',-apple-system,Roboto,'Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    overflow:hidden;height:100vh;-webkit-font-smoothing:antialiased}
  #viewport{position:fixed;inset:0}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;
    justify-content:space-between;padding:16px 22px;pointer-events:none}
  #hud h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.2px}
  #hud .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
  #badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;
    padding:5px 10px;border-radius:6px;letter-spacing:.3px}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;background:var(--bg);z-index:10;transition:opacity .35s}
  #loading .bar{width:220px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
  #loading .bar > div{height:100%;width:0%;background:var(--accent);transition:width .2s}
  #loading .pct{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    font-size:12px;color:var(--ink-2);background:rgba(255,255,255,.7);
    backdrop-filter:blur(6px);padding:6px 14px;border-radius:20px;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="viewport"></div>
<div id="hud">
  <div>
    <h1>AeroTwin · Digital Twin Preview</h1>
    <div class="sub">Airplane-body asset · orbit to inspect</div>
  </div>
  <div id="badge">PREVIEW — not wired to twin data</div>
</div>
<div id="hint">drag to orbit · scroll to zoom</div>
<div id="loading">
  <div class="bar"><div id="bar-fill"></div></div>
  <div class="pct" id="pct">Loading model…</div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
import { MTLLoader } from "three/addons/loaders/MTLLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const viewport = document.getElementById("viewport");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f5);
scene.fog = new THREE.Fog(0xeef1f5, 60, 260);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(18, 9, 22);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 80;
controls.target.set(0, 1.5, 0);
controls.maxPolarAngle = Math.PI * 0.49;

// lighting rig — soft key + fill + rim, matches the twin's light aesthetic
const hemi = new THREE.HemisphereLight(0xffffff, 0xb9c2cf, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(25, 30, 15);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -30; key.shadow.camera.right = 30;
key.shadow.camera.top = 30; key.shadow.camera.bottom = -30;
key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0xe07d17, 0.5);
rim.position.set(-20, 10, -15);
scene.add(rim);

// ground — soft shadow catcher
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.ShadowMaterial({ opacity: 0.16 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(120, 60, 0xc7cdd6, 0xdde1e7);
grid.position.y = 0.001;
scene.add(grid);

const barFill = document.getElementById("bar-fill");
const pct = document.getElementById("pct");
const loadingEl = document.getElementById("loading");

const mtlLoader = new MTLLoader();
mtlLoader.setPath("/model-assets/");
mtlLoader.load("airplane.mtl", (materials) => {
  materials.preload();
  // upgrade Phong -> Standard for PBR-ish response to the env map + rim light
  for (const key in materials.materials) {
    const m = materials.materials[key];
    if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
  }

  const objLoader = new OBJLoader();
  objLoader.setMaterials(materials);
  objLoader.setPath("/model-assets/");
  objLoader.load(
    "airplane.obj",
    (obj) => {
      obj.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (child.material) {
            child.material.metalness = 0.25;
            child.material.roughness = 0.55;
          }
        }
      });

      // 3ds Max exports are Z-up; Three.js is Y-up — stand the model upright
      obj.rotation.x = -Math.PI / 2;
      obj.updateMatrixWorld(true);

      // normalize scale/position: center + fit to a ~16-unit span
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 16 / maxDim;
      obj.scale.setScalar(scale);
      obj.updateMatrixWorld(true);

      const box2 = new THREE.Box3().setFromObject(obj);
      const center2 = new THREE.Vector3();
      box2.getCenter(center2);
      obj.position.sub(center2);
      obj.position.y += (box2.max.y - box2.min.y) / 2;

      scene.add(obj);
      loadingEl.style.opacity = "0";
      setTimeout(() => loadingEl.style.display = "none", 400);
    },
    (xhr) => {
      if (xhr.lengthComputable) {
        const p = Math.round((xhr.loaded / xhr.total) * 100);
        barFill.style.width = p + "%";
        pct.textContent = `Loading model… ${p}%`;
      }
    },
    (err) => {
      pct.textContent = "Failed to load model — see console";
      console.error(err);
    }
  );
});

window.addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
